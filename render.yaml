services:
  - type: web
    name: pharaohscan
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class eventlet -w 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: MONGODB_URI
        sync: false   # set this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false   # set this manually in Render dashboard
    autoDeploy: true
