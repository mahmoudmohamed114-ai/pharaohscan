<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11100e">
    <title>أثرنا — Atharna | لكل مكان حكاية، ولينا فيه أثر</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Three.js & Tracked AR Engine -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.151.3/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.151.3/examples/jsm/",
            "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.151.3/examples/jsm/"
        }
    }
    </script>
    <script src="/static/js/ar_3d_engine.js"></script>

    <style>
        :root {
            --ink: #11100e;
            --dark: #211d16;
            --paper: #f1e7d8;
            --gold: #d8b780;
            --bronze: #af7d49;
            --muted: #746b60;
            --line: #d8cdbc;
            --font: 'Noto Sans Arabic', Inter, Arial, sans-serif;
            --font-en: Inter, 'Noto Sans Arabic', Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font); font-size: 14px; line-height: 1.6; }
        html[dir="ltr"] { font-family: var(--font-en); }

        button, input, textarea, select { font: inherit; }
        button { cursor: pointer; color: inherit; border: 0; background: none; touch-action: manipulation; }
        button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
        }

        svg {
            width: 22px;
            height: 22px;
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        h1, h2, h3, h4, p { margin: 0; }
        a { color: inherit; text-decoration: none; }
        img { display: block; max-width: 100%; }
        [hidden] { display: none !important; }

        /* ── App Grid Shell ── */
        .app {
            height: 100dvh;
            min-height: 560px;
            display: grid;
            grid-template-rows: 76px 1fr 78px;
            overflow: hidden;
            position: relative;
        }

        /* ── Header ── */
        .header {
            padding: 0 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            z-index: 30;
            background: var(--ink);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            padding: 0;
            text-align: start;
        }

        .brand-symbol {
            width: 28px;
            height: 32px;
            display: flex;
            gap: 4px;
            align-items: flex-end;
        }

        .brand-symbol i {
            display: block;
            width: 6px;
            border: 1px solid var(--gold);
            border-radius: 4px;
            background: rgba(216, 183, 128, 0.2);
        }

        .brand-symbol i:nth-child(1) { height: 18px; }
        .brand-symbol i:nth-child(2) { height: 30px; }
        .brand-symbol i:nth-child(3) { height: 23px; }

        .wordmark {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.1;
            color: var(--gold);
            letter-spacing: 0.02em;
        }

        .wordmark small {
            display: block;
            font-family: Inter, sans-serif;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.24em;
            margin-top: 2px;
            color: var(--paper);
            opacity: 0.85;
        }

        .desktop-links {
            display: flex;
            gap: 8px;
        }

        .desktop-links button {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 18px;
            border-radius: 6px;
            color: #bdb4a7;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .desktop-links button:hover {
            color: var(--paper);
            background: rgba(255, 255, 255, 0.05);
        }

        .desktop-links button.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--gold);
            font-weight: 600;
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header-context {
            display: flex;
            gap: 7px;
            align-items: center;
            color: #d6cbbb;
            font-size: 12px;
            min-height: 42px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.2s;
        }
        .header-context:hover { background: rgba(255, 255, 255, 0.08); }

        .lang-btn {
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 5px 14px;
            min-height: 38px;
            font-family: Inter, sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background: rgba(216, 183, 128, 0.1);
            border-color: var(--gold);
        }

        /* ── Main Workspace ── */
        .workspace {
            position: relative;
            overflow: hidden;
            min-height: 0;
            height: 100%;
        }

        /* ── Camera First Viewfinder Layout ── */
        .camera-layout {
            height: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            direction: ltr;
            gap: 0;
            overflow: hidden;
        }
        .camera-layout > * { direction: rtl; }
        html[dir="ltr"] .camera-layout > * { direction: ltr; }

        .viewfinder {
            position: relative;
            height: 100%;
            background: var(--dark);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scene-image, .camera-feed {
            height: 100%;
            width: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }
        .scene-image { object-position: center 45%; }

        .scrim-top {
            position: absolute;
            inset: 0 0 auto;
            height: 120px;
            background: linear-gradient(rgba(17, 16, 14, 0.85), transparent);
            pointer-events: none;
            z-index: 2;
        }

        .scene-badge {
            position: absolute;
            top: 20px;
            inset-inline-start: 22px;
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(17, 16, 14, 0.85);
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-size: 11px;
            z-index: 4;
            backdrop-filter: blur(8px);
        }
        .scene-badge b {
            height: 6px;
            width: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }
        .scene-badge.analyzing b {
            background: var(--gold);
            box-shadow: 0 0 8px var(--gold);
            animation: pulse-dot 1s infinite alternate;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .camera-toggle-btn {
            position: absolute;
            top: 18px;
            inset-inline-end: 22px;
            background: rgba(17, 16, 14, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            min-height: 40px;
            padding: 6px 14px;
            font-size: 11px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 4;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .camera-toggle-btn:hover { background: rgba(17, 16, 14, 0.95); border-color: var(--gold); }

        /* ── Gold Framing Corners ── */
        .corners {
            position: absolute;
            width: 58%;
            height: 50%;
            top: 22%;
            left: 21%;
            pointer-events: none;
            z-index: 3;
            transition: all 0.3s ease;
        }
        .corners i {
            width: 28px;
            height: 28px;
            position: absolute;
            border-color: var(--gold);
            border-style: solid;
            opacity: 0.95;
            box-shadow: 0 0 10px rgba(216, 183, 128, 0.25);
        }
        .corners i:nth-child(1) { left: 0; top: 0; border-width: 2.5px 0 0 2.5px; border-radius: 8px 0 0 0; }
        .corners i:nth-child(2) { right: 0; top: 0; border-width: 2.5px 2.5px 0 0; border-radius: 0 8px 0 0; }
        .corners i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 2.5px 2.5px; border-radius: 0 0 0 8px; }
        .corners i:nth-child(4) { bottom: 0; right: 0; border-width: 0 2.5px 2.5px 0; border-radius: 0 0 8px 0; }

        /* ── Dynamic Camera Hint Pill ── */
        .camera-hint {
            position: absolute;
            top: calc(72% + 14px);
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 4;
        }
        .camera-hint span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(17, 16, 14, 0.88);
            border: 1px solid rgba(216, 183, 128, 0.35);
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--paper);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        /* ── Capture Dock ── */
        .capture-dock {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 38px;
            direction: ltr;
            z-index: 5;
        }

        .round-action-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(17, 16, 14, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.22);
            display: grid;
            place-items: center;
            transition: all 0.2s;
            color: var(--paper);
            backdrop-filter: blur(8px);
        }
        .round-action-btn:hover {
            transform: scale(1.08);
            background: rgba(17, 16, 14, 0.95);
            border-color: var(--gold);
            color: var(--gold);
        }

        .shutter-btn {
            width: 74px;
            height: 74px;
            border: 2.5px solid var(--gold);
            border-radius: 50%;
            padding: 5px;
            background: rgba(17, 16, 14, 0.6);
            display: grid;
            place-items: center;
            transition: all 0.2s;
            cursor: pointer;
            backdrop-filter: blur(6px);
        }
        .shutter-btn span {
            width: 100%;
            height: 100%;
            background: var(--paper);
            border-radius: 50%;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background 0.15s;
        }
        .shutter-btn:hover span { transform: scale(0.96); background: #ffffff; }
        .shutter-btn:active span { transform: scale(0.88); }
        .shutter-btn.scanning {
            border-color: #10b981;
            animation: pulse-border 1.2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* ── Side Panel (Desktop Results) ── */
        .side-panel {
            background: var(--paper);
            color: var(--ink);
            height: 100%;
            overflow-y: auto;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            border-inline-start: 1px solid var(--line);
            z-index: 10;
        }

        .eyebrow {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.1em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .side-panel h1 {
            font-size: 26px;
            line-height: 1.45;
            margin: 10px 0;
            color: var(--ink);
        }

        .side-panel p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .side-image {
            margin-top: 24px;
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 40px 4px 4px 4px;
            border: 1px solid var(--line);
        }

        .side-bottom {
            margin-top: auto;
            padding-top: 24px;
        }

        .link-button {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
            padding: 12px 0;
            text-align: start;
            font-size: 13px;
            font-weight: 500;
            border-top: 1px solid var(--line);
        }
        .link-button:hover { color: var(--bronze); }

        .tiny {
            font-size: 11px !important;
            color: var(--muted);
        }

        /* ── Results Container / Sheet ── */
        .sheet {
            position: absolute;
            bottom: 0;
            inset-inline: 0;
            max-height: 80%;
            overflow-y: auto;
            background: var(--paper);
            color: var(--ink);
            z-index: 25;
            border-radius: 24px 24px 0 0;
            padding: 10px 24px 28px;
            max-width: 600px;
            margin-inline: auto;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35);
            animation: slide-up 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-handle {
            width: 100%;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .sheet-handle span {
            height: 4px;
            width: 40px;
            border-radius: 4px;
            background: #b1a798;
        }

        .sheet-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-top: 4px;
        }

        .sheet h2, .side-panel-result h2 {
            font-size: 24px;
            margin: 4px 0 6px;
            line-height: 1.35;
            color: var(--ink);
        }

        .sheet-intro {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
        }

        .sheet-close-btn {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            border: 1px solid var(--line);
            color: var(--ink);
            transition: all 0.2s;
        }
        .sheet-close-btn:hover { background: rgba(0,0,0,0.06); }

        .sheet-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 14px 0;
        }

        .sheet-actions button {
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 7px 16px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--ink);
            transition: all 0.2s;
        }
        .sheet-actions button:hover {
            border-color: var(--bronze);
            color: var(--bronze);
            background: rgba(175, 125, 73, 0.08);
        }
        .sheet-actions button.active-action {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--line);
            gap: 24px;
            margin: 14px 0 16px;
        }
        .tabs button {
            min-height: 44px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            padding: 6px 0;
            transition: all 0.2s;
        }
        .tabs button.active {
            color: var(--ink);
            border-color: var(--bronze);
            font-weight: 600;
        }

        .source-note {
            font-size: 11px;
            color: var(--muted);
            margin: 12px 0;
        }

        /* ── Extracted Artifacts Gallery (Indoor Pipeline) ── */
        .artifacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin: 14px 0;
        }

        .artifact-crop-card {
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .artifact-crop-img-box {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 4px;
            overflow: hidden;
            display: grid;
            place-items: center;
            background-color: #f8fafc;
            background-image: 
                linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 12px 12px;
            background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
        }

        .artifact-crop-img-box img {
            max-width: 92%;
            max-height: 92%;
            object-fit: contain;
        }

        .artifact-crop-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }

        .item-id-pill {
            background: #f1f5f9;
            color: #475569;
            font-family: monospace;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .item-conf-pill {
            color: #10b981;
            font-weight: 600;
        }

        .artifact-crop-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-download-crop {
            margin-top: auto;
            font-size: 11px;
            padding: 5px 8px;
            border-radius: 4px;
            background: var(--ink);
            color: var(--paper);
            text-align: center;
            font-weight: 500;
            display: block;
        }

        /* ── Technical Pipeline Secondary Disclosure ── */
        .pipeline-disclosure {
            margin-top: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.4);
        }
        .pipeline-disclosure summary {
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }
        .pipeline-thumbs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .pipeline-thumbs-row img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--line);
        }

        /* ── Pages (Discover, Stories, Memories) ── */
        .page {
            height: 100%;
            overflow-y: auto;
            background: var(--paper);
            color: var(--ink);
            padding: 32px max(24px, calc((100% - 1040px) / 2)) 48px;
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }

        .page h1 {
            font-size: 30px;
            line-height: 1.4;
            color: var(--ink);
        }

        .chip-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 18px;
            scrollbar-width: none;
        }
        .chip-row::-webkit-scrollbar { display: none; }

        .chip {
            padding: 7px 16px;
            border-radius: 30px;
            border: 1px solid var(--line);
            color: var(--muted);
            white-space: nowrap;
            min-height: 40px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .chip.active {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        .places-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 20px;
        }

        .place-card {
            position: relative;
            min-height: 260px;
            overflow: hidden;
            border-radius: 8px;
            text-align: start;
            padding: 0;
            background: var(--dark);
            color: var(--paper);
            transition: transform 0.2s;
        }
        .place-card:hover { transform: translateY(-2px); }

        .place-card img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        .place-card:after {
            content: '';
            position: absolute;
            inset: 35% 0 0;
            background: linear-gradient(transparent, rgba(17, 16, 14, 0.92));
        }

        .place-card .place-copy {
            position: absolute;
            inset: auto 20px 20px;
            z-index: 2;
        }
        .place-copy h2 { font-size: 22px; font-weight: 700; }
        .place-copy p { font-size: 11px; color: #e0d6c7; margin-bottom: 2px; }

        /* ── Community Stories Feed ── */
        .feed {
            max-width: 640px;
            margin: auto;
        }

        .post-card {
            padding-bottom: 22px;
            margin-bottom: 26px;
            border-bottom: 1px solid var(--line);
        }

        .post-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .avatar {
            height: 38px;
            width: 38px;
            background: #d8c4a5;
            color: var(--ink);
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-weight: 700;
            font-size: 14px;
        }

        .post-top strong { font-size: 13px; font-weight: 600; }
        .post-top small { font-size: 10px; color: var(--muted); display: block; }

        .post-img {
            height: 320px;
            width: 100%;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--line);
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 0 4px;
        }

        .post-actions button {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--muted);
            padding: 4px;
        }
        .post-actions button.liked { color: #dc2626; }

        .post-location-tag {
            margin-inline-start: auto;
            font-size: 11px;
            color: var(--muted);
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .post-caption {
            font-size: 14px;
            margin: 6px 0;
            line-height: 1.55;
            color: var(--ink);
        }

        /* ── Memories Destination ── */
        .memory-hero {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .memory-item {
            border: 0;
            padding: 0;
            position: relative;
            overflow: hidden;
            aspect-ratio: 3/4;
            border-radius: 8px;
            background: var(--dark);
            text-align: start;
        }
        .memory-item img {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }
        .memory-item span {
            position: absolute;
            bottom: 0;
            inset-inline: 0;
            background: rgba(17, 16, 14, 0.88);
            color: var(--paper);
            font-size: 11px;
            padding: 8px 10px;
        }

        .empty-state {
            max-width: 460px;
            padding: 40px 0;
            text-align: center;
            margin: auto;
        }
        .empty-state h2 { font-size: 22px; margin: 16px 0 8px; }
        .empty-state p { color: var(--muted); font-size: 13px; line-height: 1.6; }

        .primary-btn {
            background: var(--ink);
            color: var(--paper);
            padding: 12px 22px;
            border-radius: 6px;
            min-height: 46px;
            display: inline-flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .primary-btn:hover { opacity: 0.92; }

        /* ── Navigation (Mobile Bottom Bar) ── */
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--ink);
            z-index: 30;
        }
        .nav button {
            display: grid;
            justify-items: center;
            gap: 3px;
            min-width: 60px;
            color: #b6aea3;
            font-size: 10px;
            font-weight: 500;
            padding: 4px 6px;
            transition: color 0.2s;
        }
        .nav button.active { color: var(--gold); font-weight: 600; }
        .nav svg { width: 22px; height: 22px; }

        /* ── Footer Note (Desktop) ── */
        .footer-note {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            font-size: 11px;
            color: #a79d8e;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--ink);
            z-index: 20;
        }

        /* ── Modals & Dialogs ── */
        .dialog-bg {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(17, 16, 14, 0.85);
            display: grid;
            place-items: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .dialog {
            background: var(--paper);
            color: var(--ink);
            border-radius: 12px;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            max-height: 85dvh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .dialog-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }
        .dialog-head h2 { font-size: 20px; color: var(--ink); }
        .dialog textarea {
            width: 100%;
            min-height: 110px;
            border: 1px solid var(--line);
            background: #fff8ee;
            color: var(--ink);
            border-radius: 6px;
            padding: 12px;
            resize: vertical;
            margin: 12px 0;
            font-size: 13px;
        }
        .choice-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            text-align: start;
        }
        .choice-btn img {
            height: 54px;
            width: 54px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* ── Tracked AR Overlay ── */
        .ar-overlay {
            position: fixed;
            inset: 0;
            z-index: 150;
            background: #000000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .ar-overlay-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .ar-track-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(17, 16, 14, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--paper);
        }
        .ar-track-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
        }
        .ar-track-dot.tracking { background: #10b981; }

        /* ── Toast Notifications ── */
        .toast {
            position: fixed;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--paper);
            border: 1px solid rgba(216, 183, 128, 0.5);
            padding: 10px 22px;
            border-radius: 8px;
            z-index: 200;
            max-width: min(90vw, 480px);
            font-size: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: fade-in 0.2s ease;
        }
        @keyframes fade-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

        /* ── Responsive Rules ── */
        @media (min-width: 900px) {
            .nav { display: none; }
            .sheet { display: none; }
            .app { grid-template-rows: 76px 1fr 38px; }
            .camera-layout.result-open .corners,
            .camera-layout.result-open .camera-hint { display: none; }
        }

        @media (max-width: 899px) {
            .header { height: 66px; padding: 0 16px; }
            .app { grid-template-rows: 66px 1fr calc(68px + env(safe-area-inset-bottom)); }
            .desktop-links, .footer-note { display: none; }
            .camera-layout { display: block; }
            .side-panel { display: none; }
            .corners { width: 72%; left: 14%; height: 48%; top: 20%; }
            .camera-hint { top: auto; bottom: 104px; }
            .capture-dock { bottom: 20px; gap: 36px; }
            .shutter-btn { width: 68px; height: 68px; }
            .round-action-btn { width: 44px; height: 44px; }
            .places-grid { grid-template-columns: 1fr; }
            .page { padding: 22px 16px 36px; }
            .memory-grid { grid-template-columns: repeat(2, 1fr); }
            .camera-layout.result-open .corners,
            .camera-layout.result-open .camera-hint,
            .camera-layout.result-open .capture-dock { display: none; }
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- ── Top Header ── -->
        <header class="header">
            <button class="brand" onclick="navigate('camera')" aria-label="أثرنا — الصفحة الرئيسية">
                <span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="wordmark">أثرنا<small>ATHARNA</small></span>
            </button>

            <nav class="desktop-links" aria-label="Main navigation" id="desktop-nav"></nav>

            <div class="header-right">
                <button class="header-context" onclick="openPlaceSelector()" id="place-context-btn">
                    <svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/></svg>
                    <span id="place-context-name">القاهرة التاريخية</span>
                </button>
                <button class="lang-btn" onclick="toggleLanguage()" id="lang-switch-btn">EN</button>
            </div>
        </header>

        <!-- ── Main Dynamic Workspace ── -->
        <main class="workspace" id="workspace" tabindex="-1"></main>

        <!-- ── Mobile Bottom Navigation Bar ── -->
        <nav class="nav" id="mobile-nav" aria-label="التنقل الرئيسي"></nav>

        <!-- ── Desktop Footer ── -->
        <footer class="footer-note">
            <span>ATHARNA / أثرنا</span>
            <span id="footer-tagline">«لكل مكان حكاية، ولينا فيه أثر.»</span>
            <span>النسخة الموحدة المتكاملة</span>
        </footer>
    </div>

    <!-- Hidden Native File Picker -->
    <input type="file" id="file-input" accept="image/*" hidden>

    <!-- Hidden Canvas for Frame Captures -->
    <canvas id="capture-canvas" hidden></canvas>

    <!-- Modal Dialog Host -->
    <div id="modal" hidden></div>

    <!-- Tracked AR Overlay Host -->
    <div id="ar-overlay" class="ar-overlay" hidden>
        <div class="ar-overlay-top">
            <div class="ar-track-status">
                <div class="ar-track-dot" id="ar-track-dot"></div>
                <span id="ar-track-status-txt">جاري تهيئة الواقع المعزز…</span>
            </div>
            <button class="sheet-close-btn" onclick="closeAR()" aria-label="إغلاق AR" style="color:#ffffff;border-color:rgba(255,255,255,0.3)">
                <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
        </div>
        <div id="ar-tracked-container" style="width:100%;height:100%;position:relative"></div>
    </div>

    <!-- Toast Notification Host -->
    <div class="toast" id="toast" role="status" hidden></div>

    <script>
        /* ── SVG Icons Catalog ── */
        const ICONS = {
            camera: '<path d="M14 4h-4l-2 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-4z"/><circle cx="12" cy="13" r="4"/>',
            compass: '<circle cx="12" cy="12" r="10"/><path d="m16 8-3 5-5 3 3-5z"/>',
            book: '<path d="M12 5C9 3 5 3 2 4v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-7-1-10 1v15"/>',
            user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
            pin: '<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>',
            image: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/>',
            flip: '<path d="M3 7h13a5 5 0 0 1 5 5M18 4l3 3-3 3M21 17H8a5 5 0 0 1-5-5M6 20l-3-3 3-3"/>',
            close: '<path d="m6 6 12 12M18 6 6 18"/>',
            heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
            message: '<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H3l2-5A8.5 8.5 0 1 1 21 11.5z"/>',
            bookmark: '<path d="M6 3h12v19l-6-4-6 4z"/>',
            check: '<path d="m5 12 4 4L19 6"/>',
            cube: '<path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10M7.5 4.5l9 5"/>',
            plus: '<path d="M12 5v14M5 12h14"/>',
            download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
            pause: '<path d="M8 4v16M16 4v16"/>'
        };

        const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.camera}</svg>`;
        const $id = id => document.getElementById(id);

        /* ── State Management ── */
        let currentLang = localStorage.getItem('atharna_lang') || 'ar';
        let currentView = 'camera';
        let activePlaceKey = 'cairo';
        let currentResult = null;
        let isResultOpen = false;
        let resultActiveTab = 'place';
        let isStorySaved = false;
        let isLikedMap = {};
        let activeFilter = 'all';

        // Camera & Media
        let mediaStream = null;
        let facingMode = 'environment';
        let isCameraActive = false;
        let uploadedPhotoUrl = null;
        let currentPhotoBlob = null;
        let isScanningActive = false;
        let pollTimer = null;

        // Socket.IO
        let socket = null;
        let communityPosts = [];
        let userMemories = [];

        /* ── Internationalization Dictionary ── */
        const T = (ar, en) => currentLang === 'ar' ? ar : en;

        const CURATED_PLACES = {
            cairo: {
                key: 'cairo',
                image: '/static/images/image30.jpeg',
                name: ['القاهرة التاريخية', 'Historic Cairo'],
                tag: ['عمارة وتراث إسلامي', 'Islamic Heritage & Architecture'],
                text: ['تأمّل تفاصيل العمارة والزخارف المملوكية والفاطمية، وافتح حكايات الناس وتاريخ المكان.', 'Explore the intricate Mamluk and Fatimid architecture, and discover stories left across centuries.'],
                lat: 30.0444, lng: 31.2357
            },
            museum: {
                key: 'museum',
                image: '/static/images/image10.jpeg',
                name: ['المتحف ومجموعات الحُلي', 'Museum Jewelry & Antiquities'],
                tag: ['مقتنيات أثرية ومجوهرات', 'Royal Artifacts & Jewelry'],
                text: ['مقتنيات ذهبية وتفاصيل دقيقة من مقابر الفراعنة والملوك. اضغط على أي قطعة لاستكشاف تقطيعها وتاريخها.', 'Exquisite gold ornaments and precious antiquities from royal dynasties. Tap items to explore detail & provenance.'],
                lat: 30.0478, lng: 31.2336
            },
            giza: {
                key: 'giza',
                image: '/static/images/image1.jpeg',
                name: ['هضبة الجيزة والأهرامات', 'Giza Plateau & Pyramids'],
                tag: ['عجائب العالم القديم', 'Wonders of the Ancient World'],
                text: ['الأهرامات الثلاثة وأبو الهول، صروح خالدة تحكي تاريخ الملوك والمهندسين عبر آلاف السنين.', 'The Great Pyramids and the Sphinx, timeless stone monuments telling the stories of builders and kings.'],
                lat: 29.9792, lng: 31.1342
            }
        };

        /* ── Navigation Shell Render ── */
        function renderNav() {
            const navItems = [
                ['discover', 'compass', 'اكتشف', 'Explore'],
                ['camera', 'camera', 'الكاميرا', 'Camera'],
                ['stories', 'book', 'حكايات', 'Stories'],
                ['memories', 'user', 'ذكرياتي', 'Memories']
            ];

            const html = navItems.map(([id, ic, ar, en]) => `
                <button class="${currentView === id ? 'active' : ''}" 
                        ${currentView === id ? 'aria-current="page"' : ''} 
                        onclick="navigate('${id}')">
                    ${icon(ic)}
                    <span>${T(ar, en)}</span>
                </button>
            `).join('');

            $id('desktop-nav').innerHTML = html;
            $id('mobile-nav').innerHTML = html;

            const placeObj = CURATED_PLACES[activePlaceKey] || CURATED_PLACES.cairo;
            $id('place-context-name').textContent = T(placeObj.name[0], placeObj.name[1]);
            $id('lang-switch-btn').textContent = currentLang === 'ar' ? 'EN' : 'عربي';

            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            $id('footer-tagline').textContent = T('«لكل مكان حكاية، ولينا فيه أثر.»', '“Every place has a story, and we leave our mark.”');
        }

        /* ── Navigation Controller ── */
        function navigate(dest) {
            closeModal();
            if (dest !== 'camera') {
                stopCameraStream();
            } else if (!mediaStream && !uploadedPhotoUrl) {
                initCameraStream();
            }
            currentView = dest;
            renderWorkspace();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('atharna_lang', currentLang);
            renderNav();
            renderWorkspace();
        }

        /* ── Workspace Routing ── */
        function renderWorkspace() {
            renderNav();
            const ws = $id('workspace');
            if (currentView === 'camera') ws.innerHTML = renderCameraView();
            else if (currentView === 'discover') ws.innerHTML = renderDiscoverView();
            else if (currentView === 'stories') ws.innerHTML = renderStoriesView();
            else if (currentView === 'memories') ws.innerHTML = renderMemoriesView();

            if (currentView === 'camera' && isCameraActive && mediaStream) {
                const vid = $id('camera-feed');
                if (vid) {
                    vid.srcObject = mediaStream;
                    vid.play().catch(() => {});
                }
            }
        }

        /* ══════════════════════════════════════════════════════════════════
           DESTINATION 1: CAMERA WORKSPACE (HOME)
        ══════════════════════════════════════════════════════════════════ */
        function renderCameraView() {
            const place = CURATED_PLACES[activePlaceKey] || CURATED_PLACES.cairo;
            const bgImage = uploadedPhotoUrl || place.image;

            return `
                <div class="camera-layout ${isResultOpen ? 'result-open' : ''}">
                    <!-- Left/Main: Viewfinder -->
                    <section class="viewfinder" aria-label="${T('معاينة الكاميرا والمشهد', 'Camera Viewfinder')}">
                        <!-- Background scene preview or uploaded image -->
                        <img class="scene-image" id="scene-image" src="${bgImage}" 
                             alt="${T('معاينة المشهد', 'Scene preview')}" 
                             ${isCameraActive && mediaStream && !uploadedPhotoUrl ? 'hidden' : ''}>
                        
                        <!-- Live video stream -->
                        <video class="camera-feed" id="camera-feed" autoplay muted playsinline 
                               ${!isCameraActive || !mediaStream || uploadedPhotoUrl ? 'hidden' : ''}></video>

                        <div class="scrim-top"></div>

                        <!-- Status badge -->
                        <div class="scene-badge ${isScanningActive ? 'analyzing' : ''}" id="scene-badge">
                            <b></b>
                            <span>${isScanningActive ? T('جاري التحليل بالذكاء الاصطناعي…', 'Analyzing with AI…') 
                                    : (isCameraActive && mediaStream ? T('الكاميرا نشطة', 'Camera Active') 
                                    : (uploadedPhotoUrl ? T('صورة مختارة', 'Selected Photo') 
                                    : T('مشهد حي', 'Live Scene')))}</span>
                        </div>

                        <!-- Camera Toggle Button -->
                        <button class="camera-toggle-btn" onclick="toggleCameraState()">
                            ${icon(isCameraActive && mediaStream ? 'pause' : 'camera')}
                            <span>${isCameraActive && mediaStream ? T('إيقاف الكاميرا', 'Stop Camera') : T('تشغيل الكاميرا', 'Enable Camera')}</span>
                        </button>

                        <!-- Gold Framing Corners -->
                        <div class="corners" aria-hidden="true">
                            <i></i><i></i><i></i><i></i>
                        </div>

                        <!-- Dynamic Contextual Hint Pill -->
                        <div class="camera-hint">
                            <span id="camera-hint-text">
                                ${isScanningActive ? T('جاري البحث عن تطابق وتحليل الأثر…', 'Looking for a match…') 
                                  : (uploadedPhotoUrl ? T('اضغط زر الالتقاط لبدء الفحص', 'Tap shutter to scan photo') 
                                  : T('وجّه الكاميرا نحو المعلم أو الأثر', 'Point your camera at a landmark or artifact'))}
                            </span>
                        </div>

                        <!-- Bottom Capture Dock -->
                        <div class="capture-dock">
                            <!-- Left: Pick Photo Button -->
                            <button class="round-action-btn" title="${T('اختيار صورة من الجهاز', 'Upload Photo')}" 
                                    aria-label="${T('اختيار صورة من الجهاز', 'Upload Photo')}"
                                    onclick="$id('file-input').click()">
                                ${icon('image')}
                            </button>

                            <!-- Center: Circular Gold Shutter -->
                            <button class="shutter-btn ${isScanningActive ? 'scanning' : ''}" 
                                    id="shutter-btn" 
                                    title="${T('التقاط وفحص الأثر', 'Capture & Scan')}" 
                                    aria-label="${T('التقاط وفحص الأثر', 'Capture & Scan')}"
                                    onclick="triggerCapture()">
                                <span></span>
                            </button>

                            <!-- Right: Flip Camera -->
                            <button class="round-action-btn" title="${T('تبديل الكاميرا', 'Flip Camera')}" 
                                    aria-label="${T('تبديل الكاميرا', 'Flip Camera')}"
                                    onclick="flipCameraFacing()">
                                ${icon('flip')}
                            </button>
                        </div>

                        <!-- Mobile Bottom Sheet Results -->
                        ${isResultOpen ? `
                            <section class="sheet" id="mobile-result-sheet" aria-label="${T('نتيجة الفحص وحكاية الأثر', 'Recognition Result')}">
                                ${renderResultContent()}
                            </section>
                        ` : ''}
                    </section>

                    <!-- Right Column: Desktop Editorial Side Panel -->
                    <aside class="side-panel">
                        ${isResultOpen ? `
                            <div class="side-panel-result">${renderResultContent()}</div>
                        ` : `
                            <span class="eyebrow">${T('لكل مكان حكاية', 'EVERY PLACE HAS A STORY')}</span>
                            <h1>${T('ولينا فيه أثر.', 'Leave your own.')}</h1>
                            <p>${T('التقط أي معلم أثري أو قطعة حلي ومتحفية للتعرف عليها فوراً واستكشاف حكايتها والواقع المعزز.', 'Point your camera or upload a photo of any heritage monument or museum jewelry to instantly discover its history, 3D AR, and community stories.')}</p>
                            <img class="side-image" src="/static/images/image14.jpeg" alt="${T('زيارة متحف وتراث', 'Heritage exploration')}">
                            <div class="side-bottom">
                                <button class="link-button" onclick="openPlaceSelector()">
                                    ${icon('pin')}
                                    <span>${T('استكشف معالم وأماكن أخرى', 'Explore more destinations')}</span>
                                </button>
                                <p class="tiny">${T('نظام التعرّف الموحد يدمج المعالم الخارجية وتجزئة مقتنيات المتاحف تلقائياً.', 'Unified recognition auto-routes outdoor monuments and museum artifact instance segmentation seamlessly.')}</p>
                            </div>
                        `}
                    </aside>
                </div>
            `;
        }

        /* ── Result Content Renderer (Shared between Mobile Sheet & Desktop Side-Panel) ── */
        function renderResultContent() {
            if (!currentResult) return '';

            const isIndoor = currentResult.pipeline === 'artifact_segmentation';
            const gemini = currentResult.gemini || {};

        /* ══════════════════════════════════════════════════════════════════
           CAMERA & DETECTION ENGINE
        ══════════════════════════════════════════════════════════════════ */
        async function initCameraStream() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast(T('الكاميرا غير مدعومة بالمتصفح أو تحتاج اتصال HTTPS.', 'Camera requires a supported browser and HTTPS/localhost.'));
                return;
            }
            stopCameraStream();
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                isCameraActive = true;
                uploadedPhotoUrl = null;
                currentPhotoBlob = null;
                renderWorkspace();
            } catch (err) {
                console.warn('Camera access denied or unavailable:', err);
                isCameraActive = false;
                showToast(T('تعذّر تشغيل الكاميرا. يمكنك اختيار صورة عبر زر الصور.', 'Could not access camera. You can choose a photo instead.'));
                renderWorkspace();
            }
        }

        function stopCameraStream() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            isCameraActive = false;
        }

        function toggleCameraState() {
            if (isCameraActive && mediaStream) {
                stopCameraStream();
            } else {
                uploadedPhotoUrl = null;
                currentPhotoBlob = null;
                initCameraStream();
            }
            renderWorkspace();
        }

        async function flipCameraFacing() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            await initCameraStream();
        }

        // Shutter Click Handler
        function triggerCapture() {
            if (isScanningActive) return;

            // Case A: We have a live camera stream -> capture current video frame
            if (isCameraActive && mediaStream) {
                const video = $id('camera-feed');
                if (!video || !video.videoWidth) {
                    showToast(T('الكاميرا ليست جاهزة بعد.', 'Camera is not ready yet.'));
                    return;
                }

                const canvas = $id('capture-canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(blob => {
                    if (blob) {
                        currentPhotoBlob = blob;
                        uploadedPhotoUrl = URL.createObjectURL(blob);
                        stopCameraStream();
                        renderWorkspace();
                        executeDetection(blob, 'capture.jpg');
                    }
                }, 'image/jpeg', 0.90);
                return;
            }

            // Case B: We have a photo already picked
            if (currentPhotoBlob) {
                executeDetection(currentPhotoBlob, 'photo.jpg');
                return;
            }

            // Case C: Neither -> prompt user to pick photo or enable camera
            $id('file-input').click();
        }

        // Native File Picker Event
        $id('file-input').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast(T('يرجى اختيار ملف صورة صالح.', 'Please choose a valid image file.'));
                return;
            }

            stopCameraStream();
            currentPhotoBlob = file;
            uploadedPhotoUrl = URL.createObjectURL(file);
            isResultOpen = false;
            renderWorkspace();
            executeDetection(file, file.name);
            e.target.value = '';
        });

        // Async API Detection Request & Polling
        async function executeDetection(fileBlob, filename) {
            isScanningActive = true;
            const hint = $id('camera-hint-text');
            if (hint) hint.textContent = T('جاري الفحص والتحليل بالذكاء الاصطناعي…', 'Looking for a match with AI…');
            const badge = $id('scene-badge');
            if (badge) badge.classList.add('analyzing');
            const shutter = $id('shutter-btn');
            if (shutter) shutter.classList.add('scanning');

            const place = CURATED_PLACES[activePlaceKey] || CURATED_PLACES.cairo;
            const formData = new FormData();
            formData.append('image', fileBlob, filename);
            formData.append('lat', place.lat);
            formData.append('lng', place.lng);
            formData.append('model_type', 'v11');

            try {
                const response = await fetch('/api/detect', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const json = await response.json();
                if (json.error) {
                    throw new Error(json.error);
                }

                const jobId = json.job_id;
                if (!jobId) {
                    throw new Error('No job ID returned.');
                }

                // Poll job result
                pollDetectionJob(jobId);
            } catch (err) {
                console.error('Detection error:', err);
                isScanningActive = false;
                showToast(T('تعذّر إكمال الفحص: ', 'Scan failed: ') + err.message);
                renderWorkspace();
            }
        }

        function pollDetectionJob(jobId) {
            let attempts = 0;
            const maxAttempts = 30; // 30 seconds max

            if (pollTimer) clearInterval(pollTimer);

            pollTimer = setInterval(async () => {
                attempts++;
                try {
                    const pollRes = await fetch(`/api/detect/result/${jobId}`);
                    if (pollRes.status === 404) {
                        if (attempts >= 4) {
                            clearInterval(pollTimer);
                            isScanningActive = false;
                            showToast(T('انتهت مهلة الفحص أو أُعيد تشغيل السيرفر. حاول مرة أخرى.', 'Scan job expired. Please try again.'));
                            renderWorkspace();
                        }
                        return;
                    }

                    const data = await pollRes.json();
                    if (data.status === 'pending') {
                        // Still processing
                        return;
                    }

                    // Completed!
                    clearInterval(pollTimer);
                    isScanningActive = false;

                    if (data.error) {
                        showToast(T('خطأ في الفحص: ', 'Detection error: ') + data.error);
                        renderWorkspace();
                        return;
                    }

                    currentResult = data;
                    isResultOpen = true;
                    isStorySaved = false;
                    resultActiveTab = 'place';
                    showToast(data.router_msg || T('تم التعرّف على الأثر بنجاح!', 'Identified successfully!'));
                    renderWorkspace();

                } catch (e) {
                    console.warn('Poll error:', e);
                    if (attempts >= maxAttempts) {
                        clearInterval(pollTimer);
                        isScanningActive = false;
                        showToast(T('انتهت مهلة الاتصال بالخادم.', 'Connection timed out.'));
                        renderWorkspace();
                    }
                }
            }, 1000);
        }

                    `).join('')}
                </div>
            `;
            openModal(T('اختر وجهة الزيارة', 'Choose Destination'), content);
        }

        function openStoryComposerForCurrent() {
            const title = currentResult?.gemini?.possibleLandmark || currentResult?.suggested_class || CURATED_PLACES[activePlaceKey].name[0];
            openStoryComposer(title);
        }

        function openStoryComposer(attachedObject = '') {
            const content = `
                ${attachedObject ? `<p style="font-size:12px;color:var(--muted);margin-bottom:8px;">${T('مرتبط بالأثر: ', 'Linked to: ')}<strong>${attachedObject}</strong></p>` : ''}
                <label for="story-caption" style="font-size:13px;font-weight:600;color:var(--ink);">${T('إيه حكايتك عن المكان؟', 'What is your story?')}</label>
                <textarea id="story-caption" placeholder="${T('اكتب شعورك، معلومة اكتشفتها، أو لحظة تحب تفتكرها…', 'Write your experience, discovery, or memory…')}" maxlength="500"></textarea>
                <button class="primary-btn" style="width:100%;" onclick="submitNewStory('${attachedObject}')">
                    ${icon('plus')}
                    <span>${T('انشر حكايتك', 'Publish Story')}</span>
                </button>
            `;
            openModal(T('شارك حكايتك', 'Share Your Story'), content);
        }

        async function submitNewStory(attachedObject) {
            const textarea = $id('story-caption');
            const text = textarea ? textarea.value.trim() : '';
            if (!text) {
                showToast(T('يرجى كتابة الحكاية أولاً.', 'Please write your story first.'));
                return;
            }

            const postData = {
                content: text,
                author: T('زائر أثرنا', 'Atharna Visitor'),
                object_id: currentResult?.object?.object_id || 'O001',
                location_id: currentResult?.object?.location_id || 'L001',
                location_name: attachedObject || T('القاهرة التاريخية', 'Historic Cairo'),
                image_url: uploadedPhotoUrl || CURATED_PLACES[activePlaceKey].image
            };

            try {
                const res = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });
                const savedPost = await res.json();
                communityPosts.unshift(savedPost.post || postData);
                closeModal();
                showToast(T('تم نشر حكايتك ومشاركتها مع الزوار!', 'Story published successfully!'));
                if (currentView === 'stories') renderWorkspace();
            } catch (err) {
                console.error('Failed to post story:', err);
                communityPosts.unshift(postData);
                closeModal();
                showToast(T('تم حفظ الحكاية محلياً.', 'Story saved locally.'));
                if (currentView === 'stories') renderWorkspace();
            }
        }

        function openModal(title, html) {
            const host = $id('modal');
            host.innerHTML = `
                <div class="dialog-bg" onclick="if(event.target===this)closeModal()">
                    <section class="dialog" role="dialog" aria-modal="true">
                        <div class="dialog-head">
                            <h2>${title}</h2>
                            <button class="sheet-close-btn" onclick="closeModal()" aria-label="${T('إغلاق', 'Close')}">
                                ${icon('close')}
                            </button>
                        </div>
                        ${html}
                    </section>
                </div>
            `;
            host.hidden = false;
        }

        function closeModal() {
            const host = $id('modal');
            host.hidden = true;
            host.innerHTML = '';
        }

        /* ══════════════════════════════════════════════════════════════════
           TRACKED AUGMENTED REALITY (AR)
        ══════════════════════════════════════════════════════════════════ */
        async function launchARSession() {
            if (!currentResult) {
                showToast(T('يرجى فحص أثر أو معلم أولاً.', 'Scan an artifact or landmark first.'));
                return;
            }

            const object = currentResult.object || currentResult.auto_object;
            const artifactName = object?.name || currentResult.suggested_class || 'Landmark';

            $id('ar-overlay').hidden = false;
            $id('ar-track-status-txt').textContent = T('جاري تحميل مجسم الواقع المعزز…', 'Loading 3D AR Model…');

            try {
                if (window.AR3DEngine) {
                    const asset = await window.AR3DEngine.prepare({
                        objectId: object?.object_id || 'O001',
                        className: object?.class_name || 'Khafre-Pyramid',
                        name: artifactName
                    }, 'object');

                    await window.AR3DEngine.mount(asset, {
                        container: $id('ar-tracked-container'),
                        onStatus: (msg, tracked) => {
                            $id('ar-track-status-txt').textContent = msg;
                            $id('ar-track-dot').classList.toggle('tracking', tracked);
                        }
                    });
                }
            } catch (err) {
                console.warn('AR launch fallback:', err);
                $id('ar-track-status-txt').textContent = T('عرض تفاعلي مباشر ثلاثي الأبعاد', 'Interactive 3D Visual Experience');
            }
        }

        async function closeAR() {
            $id('ar-overlay').hidden = true;
            if (window.AR3DEngine) {
                await window.AR3DEngine.unmount();
            }
        }

        /* ══════════════════════════════════════════════════════════════════
           TOAST NOTIFICATIONS & UTILITIES
        ══════════════════════════════════════════════════════════════════ */
        let toastTimeout;
        function showToast(msg) {
            const t = $id('toast');
            t.textContent = msg;
            t.hidden = false;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { t.hidden = true; }, 3600);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[s]));
        }

        /* ══════════════════════════════════════════════════════════════════
           BOOTSTRAP: INITIAL DATA & SOCKET.IO
        ══════════════════════════════════════════════════════════════════ */
        async function loadInitialData() {
            try {
                // Fetch community posts from MongoDB
                const pRes = await fetch('/api/posts');
                if (pRes.ok) {
                    communityPosts = await pRes.json();
                }
            } catch (e) {
                console.warn('Initial posts load offline fallback:', e);
                communityPosts = [
                    {
                        post_id: 'P001',
                        author: 'مريم أحمد',
                        content: 'جمال العمارة الإسلامية في شارع المعز لا ينتهي.. كل زيارة فيها اكتشاف جديد.',
                        location_name: 'القاهرة التاريخية',
                        image_url: '/static/images/image30.jpeg',
                        createdAt: new Date().toISOString()
                    },
                    {
                        post_id: 'P002',
                        author: 'عمر شريف',
                        content: 'الوقوف أمام الهرم الأكبر شعور استثنائي بعظمة الأجداد.',
                        location_name: 'هضبة الجيزة',
                        image_url: '/static/images/image1.jpeg',
                        createdAt: new Date().toISOString()
                    }
                ];
            }

            // Socket.IO Real-time Connection
            if (typeof io !== 'undefined') {
                socket = io();
                socket.on('connect', () => {
                    console.log('[ATHARNA] Connected to Real-time Socket.IO Server');
                });
                socket.on('new_post', data => {
                    if (data && data.post) {
                        communityPosts.unshift(data.post);
                        if (currentView === 'stories') renderWorkspace();
                        showToast(T('حكاية جديدة شاركها زائر للتو!', 'A visitor just shared a new story!'));
                    }
                });
            }

            // Initial render
            renderWorkspace();

            // Auto-start camera if permissions already granted
            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'camera' }).then(p => {
                    if (p.state === 'granted') {
                        initCameraStream();
                    }
                }).catch(() => {});
            }
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', loadInitialData);
    </script>
</body>
</html>
