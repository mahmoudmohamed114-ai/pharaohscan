                                <button type="button" class="pen-swatch" style="background:#1e3a8a" title="لازورد" onclick="setPenColor('#1e3a8a', this)"></button>
                            </div>

                            <!-- Pen Sizes -->
                            <div class="pen-sizes">
                                <button type="button" class="pen-size-btn" onclick="setPenWidth(1.5, this)">${T('رفيع', 'Fine')}</button>
                                <button type="button" class="pen-size-btn active" onclick="setPenWidth(3.5, this)">${T('عربي', 'Medium')}</button>
                                <button type="button" class="pen-size-btn" onclick="setPenWidth(6.0, this)">${T('عريض', 'Broad')}</button>
                            </div>

                            <!-- Clear -->
                            <div style="display:flex;gap:6px;">
                                <button type="button" style="font-size:11px;color:#dc2626;padding:3px 8px;border-radius:4px;border:1px solid #fca5a5;background:#fef2f2;cursor:pointer;" onclick="clearHandwrittenCanvas()">
                                    ${T('مسح', 'Clear')}
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="canvas-hint">${T('✍️ استخدم إصبعك أو قلم الشاشة أو الماوس للكتابة والرسم بحرية', '✍️ Use your finger, stylus, or mouse to draw smoothly')}</div>
                </div>

                <!-- Panel 2: Visitor Photo -->
                <div id="memory-panel-photo" class="memory-studio-panel" style="display:none;">
                    <p style="font-size:12px;color:var(--muted);margin-bottom:8px;">
                        ${T('التقط صورة لنفسك أو ارفع لقطة من زيارتك بجانب هذا المعلم:', 'Upload a selfie or personal photograph taken with this landmark:')}
                    </p>
                    <div style="border:2px dashed var(--line);border-radius:8px;padding:20px;text-align:center;cursor:pointer;background:#fffaf3;" onclick="$id('visitor-photo-input').click()">
                        <div id="visitor-photo-preview-box">
                            <span style="font-size:32px;display:block;margin-bottom:6px;">📷</span>
                            <strong style="font-size:13px;color:var(--ink);">${T('اضغط لاختيار صورة الزيارة', 'Click to choose photo')}</strong>
                            <small style="display:block;color:var(--muted);font-size:11px;margin-top:2px;">PNG, JPG ${T('حتى 10 ميجابايت', 'up to 10MB')}</small>
                        </div>
                    </div>
                    <input type="file" id="visitor-photo-input" accept="image/*" style="display:none;" onchange="handleVisitorPhotoSelected(event)">
                </div>

                <!-- Panel 3: Written Note -->
                <div id="memory-panel-note" class="memory-studio-panel" style="display:none;">
                    <label for="memory-note-text" style="font-size:12px;font-weight:600;color:var(--ink);">${T('ماذا تحب أن تتذكر عن هذا الأثر؟', 'What would you like to remember about this object?')}</label>
                    <textarea id="memory-note-text" placeholder="${T('شعورك، اللحظة التي رأيته فيها، أو ذكرى مع من زارك…', 'Your feeling, discovery, or memory of the visit…')}" maxlength="400"></textarea>
                </div>

                <!-- Optional share to feed checkbox -->
                <div style="display:flex;align-items:center;gap:8px;margin:14px 0 16px;">
                    <input type="checkbox" id="share-to-community-chk" checked style="accent-color:var(--bronze);width:16px;height:16px;">
                    <label for="share-to-community-chk" style="font-size:12px;color:var(--ink);cursor:pointer;">
                        ${T('مشاركة هذه الذكرى أيضاً في صفحة «حكايات الناس»', 'Also share to Community Visitor Stories')}
                    </label>
                </div>

                <button class="primary-btn" style="width:100%;background:linear-gradient(135deg, var(--ink), #2b2217);color:var(--gold);font-weight:700;" onclick="saveMemoryForCurrentObject()">
                    ${icon('feather')}
                    <span>${T('احفظ الذكرى بجوار الأثر', 'Save Memory Next to Artifact')}</span>
                </button>
            `;

            openModal(T('سجّل أثرك وذكرياتك', 'Add Your Memory & Mark'), content);

            setTimeout(() => {
                initHandwrittenCanvas();
                if (initialTab && initialTab !== 'pen') {
                    switchMemoryStudioTab(initialTab);
                }
            }, 60);
        }

        function switchMemoryStudioTab(tab) {
            ['pen', 'photo', 'note'].forEach(t => {
                const btn = $id(`tab-btn-${t}`);
                const panel = $id(`memory-panel-${t}`);
                if (btn) btn.classList.toggle('active', t === tab);
                if (panel) panel.style.display = (t === tab ? 'block' : 'none');
            });
            if (tab === 'pen') {
                setTimeout(resizeCanvasIfNeeded, 30);
            }
        }

        function initHandwrittenCanvas() {
            const canvas = $id('handwritten-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = (rect.height || 180) * dpr;
            ctx.scale(dpr, dpr);

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = penColor;
            ctx.lineWidth = penWidth;

            function getCoords(e) {
                const r = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - r.left,
                    y: clientY - r.top
                };
            }

            function startDraw(e) {
                e.preventDefault();
                isDrawing = true;
                hasDrawn = true;
                const c = getCoords(e);
                lastX = c.x;
                lastY = c.y;
                ctx.beginPath();
                ctx.arc(lastX, lastY, penWidth / 2, 0, Math.PI * 2);
                ctx.fillStyle = penColor;
                ctx.fill();
            }

            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const c = getCoords(e);
                ctx.beginPath();
                ctx.strokeStyle = penColor;
                ctx.lineWidth = penWidth;
                ctx.moveTo(lastX, lastY);
                const midX = (lastX + c.x) / 2;
                const midY = (lastY + c.y) / 2;
                ctx.quadraticCurveTo(lastX, lastY, midX, midY);
                ctx.stroke();
                lastX = c.x;
                lastY = c.y;
            }

            function stopDraw(e) {
                if (isDrawing) {
                    isDrawing = false;
                }
            }

            canvas.addEventListener('pointerdown', startDraw);
            canvas.addEventListener('pointermove', draw);
            canvas.addEventListener('pointerup', stopDraw);
            canvas.addEventListener('pointercancel', stopDraw);
            canvas.addEventListener('pointerleave', stopDraw);
        }

        function resizeCanvasIfNeeded() {
            const canvas = $id('handwritten-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            if (rect.width > 0 && canvas.width !== rect.width * (window.devicePixelRatio || 1)) {
                const temp = canvas.toDataURL();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = (rect.height || 180) * dpr;
                ctx.scale(dpr, dpr);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
                img.src = temp;
            }
        }

        function setPenColor(color, el) {
            penColor = color;
            document.querySelectorAll('.pen-swatch').forEach(s => s.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function setPenWidth(w, el) {
            penWidth = w;
            document.querySelectorAll('.pen-size-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function clearHandwrittenCanvas() {
            const canvas = $id('handwritten-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasDrawn = false;
        }

        function handleVisitorPhotoSelected(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                memoryVisitorPhotoData = ev.target.result;
                const box = $id('visitor-photo-preview-box');
                if (box) {
                    box.innerHTML = `
                        <img src="${memoryVisitorPhotoData}" alt="Visitor Photo" style="max-height:160px;width:100%;object-fit:cover;border-radius:6px;">
                        <button type="button" style="margin-top:8px;font-size:11px;color:#dc2626;background:none;border:none;cursor:pointer;" onclick="event.stopPropagation();memoryVisitorPhotoData=null;switchMemoryStudioTab('photo');">
                            ${T('إلغاء الصورة', 'Remove photo')}
                        </button>
                    `;
                }
            };
            reader.readAsDataURL(file);
        }

        async function saveMemoryForCurrentObject() {
            const canvas = $id('handwritten-canvas');
            let handwrittenUrl = null;
            if (canvas && hasDrawn) {
                handwrittenUrl = canvas.toDataURL('image/png');
            }

            const noteTextarea = $id('memory-note-text');
            const noteText = noteTextarea ? noteTextarea.value.trim() : '';

            if (!handwrittenUrl && !memoryVisitorPhotoData && !noteText) {
                showToast(T('يرجى كتابة توقيع بالقلم أو إضافة صورة أو تدوينة أولاً.', 'Please handwrite with pen, add a photo, or write a note first.'));
                return;
            }

            const curPlace = getActivePlace();
            const newMemory = {
                id: 'mem_' + Date.now(),
                object_name: currentMemoryObjTitle,
                title: currentMemoryObjTitle,
                location_id: currentResult?.object?.location_id || curPlace.location_id || 'L003',
                location_name: T(curPlace.name_ar || curPlace.name, curPlace.name),
                artifact_image: currentMemoryArtifactImg,
                user_photo: memoryVisitorPhotoData,
                handwritten_url: handwrittenUrl,
                caption: noteText,
                date: new Date().toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }),
                createdAt: new Date().toISOString()
            };

            userMemories.unshift(newMemory);
            try {
                localStorage.setItem('atharna_memories', JSON.stringify(userMemories));
            } catch (e) {}

            // Share to community feed if selected
            const shareChk = $id('share-to-community-chk');
            if (shareChk && shareChk.checked) {
                try {
                    const postPayload = {
                        content: noteText || T('ذكرى وتوقيع زيارة موثق بخط اليد مع الأثر.', 'Handwritten visit memory recorded with the artifact.'),
                        author: T('زائر أثرنا', 'Atharna Visitor'),
                        object_id: currentResult?.object?.object_id || 'O001',
                        location_id: newMemory.location_id,
                        location_name: newMemory.location_name,
                        image_url: memoryVisitorPhotoData || handwrittenUrl || currentMemoryArtifactImg
                    };
                    fetch('/api/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(postPayload)
                    }).then(r => r.json()).then(data => {
                        if (data.post) communityPosts.unshift(data.post);
                    }).catch(() => {});
                } catch (e) {}
            }

            closeModal();
            showToast(T('تم حفظ ذكرى وتوقيع زيارتك بجوار هذا الأثر بنجاح! ✨', 'Your memory and signature have been saved next to this artifact! ✨'));
            renderWorkspace();
        }

        /* ══════════════════════════════════════════════════════════════════
           TRACKED AUGMENTED REALITY (AR)
        ══════════════════════════════════════════════════════════════════ */
        async function launchARSession() {
            if (!currentResult) {
                showToast(T('يرجى فحص أثر أو معلم أولاً.', 'Scan an artifact or landmark first.'));
                return;
            }

            const object = currentResult.object || currentResult.auto_object;
            const artifactName = object?.name || currentResult.suggested_class || 'Landmark';

            $id('ar-overlay').hidden = false;
            $id('ar-track-status-txt').textContent = T('جاري تحميل مجسم الواقع المعزز…', 'Loading 3D AR Model…');

            try {
                if (window.AR3DEngine) {
                    const asset = await window.AR3DEngine.prepare({
                        objectId: object?.object_id || 'O001',
                        className: object?.class_name || 'Khafre-Pyramid',
                        name: artifactName
                    }, 'object');

                    await window.AR3DEngine.mount(asset, {
                        container: $id('ar-tracked-container'),
                        onStatus: (msg, tracked) => {
                            $id('ar-track-status-txt').textContent = msg;
                            $id('ar-track-dot').classList.toggle('tracking', tracked);
                        }
                    });
                }
            } catch (err) {
                console.warn('AR launch fallback:', err);
                $id('ar-track-status-txt').textContent = T('عرض تفاعلي مباشر ثلاثي الأبعاد', 'Interactive 3D Visual Experience');
            }
        }

        async function closeAR() {
            $id('ar-overlay').hidden = true;
            if (window.AR3DEngine) {
                await window.AR3DEngine.unmount();
            }
        }

        /* ══════════════════════════════════════════════════════════════════
           TOAST NOTIFICATIONS & UTILITIES
        ══════════════════════════════════════════════════════════════════ */
        let toastTimeout;
        function showToast(msg) {
            const t = $id('toast');
            t.textContent = msg;
            t.hidden = false;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { t.hidden = true; }, 3600);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[s]));
        }

        /* ══════════════════════════════════════════════════════════════════
           BOOTSTRAP: INITIAL DATA & SOCKET.IO
        ══════════════════════════════════════════════════════════════════ */
        async function loadInitialData() {
            try {
                // Fetch locations, objects, and community posts from MongoDB Atlas
                const [locsRes, objsRes, postsRes] = await Promise.allSettled([
                    fetch('/api/locations'),
                    fetch('/api/objects'),
                    fetch('/api/posts')
                ]);

                if (locsRes.status === 'fulfilled' && locsRes.value.ok) {
                    const fetchedLocs = await locsRes.value.json();
                    if (Array.isArray(fetchedLocs) && fetchedLocs.length > 0) {
                        databaseLocations = fetchedLocs;
                    }
                }

                if (objsRes.status === 'fulfilled' && objsRes.value.ok) {
                    const fetchedObjs = await objsRes.value.json();
                    if (Array.isArray(fetchedObjs) && fetchedObjs.length > 0) {
                        databaseObjects = fetchedObjs;
                    }
                }

                if (postsRes.status === 'fulfilled' && postsRes.value.ok) {
                    communityPosts = await postsRes.value.json();
                }
            } catch (e) {
                console.warn('Initial data load fallback:', e);
            }

            // Ensure activePlaceKey points to a valid destination
            if (!databaseLocations.some(l => l.location_id === activePlaceKey)) {
                activePlaceKey = databaseLocations[0]?.location_id || 'L003';
            }

            // Socket.IO Real-time Connection
            if (typeof io !== 'undefined') {
                socket = io();
                socket.on('connect', () => {
                    console.log('[ATHARNA] Connected to Real-time Socket.IO Server');
                });
                socket.on('new_post', data => {
                    if (data && data.post) {
                        communityPosts.unshift(data.post);
                        if (currentView === 'stories') renderWorkspace();
                        showToast(T('حكاية جديدة شاركها زائر للتو!', 'A visitor just shared a new story!'));
                    }
                });
            }

            // Initial render
            renderWorkspace();

            // Auto-start camera if permissions already granted
            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'camera' }).then(p => {
                    if (p.state === 'granted') {
                        initCameraStream();
                    }
                }).catch(() => {});
            }
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', loadInitialData);
    </script>
